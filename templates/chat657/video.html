{% extends "base.html" %}
{% block extra_head %}
{% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/chat657/base.css' %}" >
    <title>Video Chat</title>
{% endblock extra_head %}
{% block content %}
<div class="chat657">
    <h2><a href="{% url 'chat657:chat' %}">Rooms</a> - <a href="{% url 'chat657:room' room_slug %}">{{ room_name }}</a></h2>
    <div id="videoGrid">
        <div id="user-{{ user.username }}">
            <p id="current-user">{{ user.username }}</p>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
    </div>
</div>
<script>
    const roomName = "{{ room_slug }}";
    const stunServerUrl = "{{ stun_server }}";
</script>
<script src="{% static 'js/chat657/video.js' %}" async=""></script>
{% endblock %}
