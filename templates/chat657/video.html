{% extends "base.html" %}
{% block extra_head %}
{% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/chat657/base.css' %}" >
    <title>Video Chat</title>
{% endblock extra_head %}
{% block content %}
<div class="chat657">
    <h2><a href="{% url 'chat657:chat' %}">Rooms</a> - <a href="{% url 'chat657:room' room.slug %}">{{ room.name }}</a></h2>

    <div id="bgSelectorContainer">
        <label for="bgSelect"><strong>Choose background:</strong></label>
        <select id="bgSelect" onchange="changeBackground(this.value)">
            <option value="">No background (Camera)</option>
            {% for bg in room.background_images.all %}
                <option value="{{ bg.image.url }}">{{ bg.title }}</option>
            {% endfor %}
        </select>
    </div>

    <div id="videoGrid">
        <div id="user-{{ user.username }}">
            <p id="current-user">{{ user.username }}</p>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
    </div>
</div>
<script src="{% static 'js/mediapipe/camera_utils/camera_utils.js' %}"></script>
<script src="{% static 'js/mediapipe/selfie_segmentation/selfie_segmentation.js' %}"></script>
<script>
    const roomName = "{{ room.slug }}";
    const stunServerUrl = "{{ stun_server }}";
</script>
<script src="{% static 'js/chat657/video.js' %}" async=""></script>
{% endblock %}
