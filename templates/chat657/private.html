{% block extra_head %}
{% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>
    <title>Private Chat</title>
{% endblock extra_head %}

{% block content %}
    <h2>Real-time chat</h2>
    <div>
        <strong>Room:</strong> <span >{{ room_name }}</span>
    </div>
    <div>
        <strong>Logged in as:</strong> <span id="current-user">{{ user.username }}</span>
    </div>
    <div>
        <div style="margin: 10px 0;">
            <label for="target-user">Select user to connect:</label>
            <select id="target-user">
                <option value="">-- Select --</option>
            </select>
            <button id="start-call-btn">Connect</button>
        </div>
        <div style="display: grid; gap: 10px; margin-bottom: 20px;">
            <video id="local-video" autoplay playsinline muted style="width: 300px; height: 200px; background: #222;"></video>
            <video id="remote-video" autoplay playsinline style="width: 300px; height: 200px; background: #222;"></video>
        </div>
        <p>Private chat</p>
        <textarea id="private-chat-log" cols="75" rows="6" readonly></textarea><br>
        <input id="private-message-input" type="text" size="50"><br>
        <button id="private-message-submit">Send</button>
    </div>

{% endblock %}

{% block javascript %}
{% endblock javascript %}

<script>
    const roomName = "{{ room_name }}";
</script>
<script src="{% static 'js/chat657/private.js' %}" async=""></script>
