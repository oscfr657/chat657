{% extends "base.html" %}
{% block extra_head %}
{% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/chat657/base.css' %}" >
    <title>Private Chat</title>
{% endblock extra_head %}
{% block content %}
<div class="chat657">
    <h2><a href="{% url 'chat657:chat' %}">Rooms</a> - <a href="{% url 'chat657:room' room_slug %}">{{ room_name }}</a></h2>
    <div id="private-chat">
        <div style="margin: 10px 0;">
            <label for="target-user">Select user to connect:</label>
            <select id="target-user">
                <option value="">-- Select --</option>
            </select>
            <button id="start-call-btn">Connect</button>
        </div>
        <div style="display: grid; gap: 10px; margin-bottom: 20px;">
            <p id="current-user">{{ user.username }}</p>
            <video id="local-video" autoplay playsinline muted></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <textarea id="private-chat-log" cols="75" rows="6" readonly></textarea><br>
        <input id="private-message-input" type="text" size="50"><br>
        <button id="private-message-submit">Send</button>
    </div>
</div>
<script>
    const roomName = "{{ room_slug }}";
    const stunServerUrl = "{{ stun_server }}";
</script>
<script src="{% static 'js/chat657/private.js' %}" async=""></script>
{% endblock %}
